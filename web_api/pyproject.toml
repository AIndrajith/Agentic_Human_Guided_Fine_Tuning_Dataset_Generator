[project]
name = "web-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=25.1.0",
    "celery[redis]>=5.3.0",
    "cryptography>=49.0.0",
    "fastapi[standard]>=0.136.3",
    "httpx>=0.28.1",
    "langgraph>=1.2.5",
    "langgraph-checkpoint-postgres>=2.0",
    "litellm==1.102.1",   # pinned: releases are frequent, upgrade on purpose
    "minio>=7.2.20",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-json-logger>=4.1.0",
    "qdrant-client>=1.7.0",
    "redis>=5.0.0",
    "resend>=2.30.1",
    "sqlalchemy[asyncio]>=2.0",
    "tiktoken>=0.13.0",
]

[tool.pytest.ini_options]
pythonpath = [".."]   # repo root, so `import web_api...` works
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
