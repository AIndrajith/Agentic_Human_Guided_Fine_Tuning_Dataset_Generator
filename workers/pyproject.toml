[project]
name = "workers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.3.0",
    "chonkie[code]>=1.6.8",
    "httpx>=0.28.1",
    "litellm==1.102.1", # pinned, same version as web_api; upgrade on purpose
    "llama-index-core>=0.10.0",
    "marker-pdf[full]>=1.10.2",
    "motor>=3.3.0",
    "pillow>=10.4.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.23.0",
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.1.0",
    "qdrant-client>=1.15.0",   # models.Document + cloud_inference (server-side BM25)
    "redis>=5.0.0",
    "tiktoken>=0.13.0",
    "torch>=2.12.0",
]

[tool.pytest.ini_options]
pythonpath = [".."]   # repo root, so `import workers...` works
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
